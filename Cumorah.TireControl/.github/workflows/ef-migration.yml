name: EF Core Migration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Cumorah.TireControl/TireControl.Domain/**'
      - 'Cumorah.TireControl/TireControl.Infrastructure/**'
      - 'Cumorah.TireControl/TireControl.Api/**'

jobs:
  migration:
    name: Validate EF Core Migration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Cumorah.TireControl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Add EF Core migration
        env:
          ConnectionStrings__Default: ${{ secrets.TIRECONTROL_CONNECTION_STRING }}
        run: |
          dotnet ef migrations add InitialCreate \
            --project TireControl.Infrastructure \
            --startup-project TireControl.Api \
            --output-dir Data/Migrations

      - name: Verify migration was generated
        run: |
          if [ ! -d "TireControl.Infrastructure/Data/Migrations" ]; then
            echo "Migration directory was not generated."
            exit 1
          fi

          if ! find TireControl.Infrastructure/Data/Migrations -type f -name '*_InitialCreate.cs' | grep -q .; then
            echo "InitialCreate migration was not generated."
            exit 1
          fi

          echo "EF Core migration generated successfully."
