name: Database Migrations
on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:

  validate-migrations:

    name: Validate Database Migrations
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================
      # DIAGNÓSTICO DA ESTRUTURA DO REPOSITÓRIO
      # ========================================================
      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "Solution files:"
          find . -name "*.sln"

          echo ""
          echo "Project files:"
          find . -name "*.csproj"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ========================================================
      # LOCALIZA AUTOMATICAMENTE A SOLUÇÃO
      # ========================================================
      - name: Find solution
        id: solution
        shell: bash
        run: |
          SOLUTION=$(find . -maxdepth 4 -name "*.sln" | head -n 1)

          echo "Solution found: $SOLUTION"

          if [ -z "$SOLUTION" ]; then
            echo "ERROR: No solution file found."
            exit 1
          fi

          echo "path=$SOLUTION" >> $GITHUB_OUTPUT

      # ========================================================
      # RESTORE
      # ========================================================
      - name: Restore dependencies
        run: |
          dotnet restore "${{ steps.solution.outputs.path }}"

      # ========================================================
      # BUILD
      # ========================================================
      - name: Build solution
        run: |
          dotnet build "${{ steps.solution.outputs.path }}" \
            --configuration Release \
            --no-restore

      # ========================================================
      # EF CORE TOOLS
      # ========================================================
      - name: Install EF Core Tools
        run: |
          dotnet tool install --global dotnet-ef

      - name: Add EF Tools to PATH
        run: |
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check EF Core version
        run: |
          dotnet ef --version

      # ========================================================
      # LOCALIZA OS PROJETOS
      # ========================================================
      - name: Show projects
        run: |
          echo "All projects:"
          find . -name "*.csproj"

      # ========================================================
      # VALIDA MIGRATIONS
      # ========================================================
      - name: Validate EF Core migrations
        run: |
          dotnet ef migrations list \
            --project TireControl.Infrastructure \
            --startup-project TireControl.Api \
            --configuration Release \
            --no-build


  # ============================================================
  # APLICA MIGRATIONS
  # SOMENTE APÓS PUSH NA MAIN
  # ============================================================
  apply-migrations:

    name: Apply Database Migrations
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs: validate-migrations

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ========================================================
      # LOCALIZA A SOLUÇÃO
      # ========================================================
      - name: Find solution
        id: solution
        shell: bash
        run: |
          SOLUTION=$(find . -maxdepth 4 -name "*.sln" | head -n 1)

          echo "Solution found: $SOLUTION"

          if [ -z "$SOLUTION" ]; then
            echo "ERROR: No solution file found."
            exit 1
          fi

          echo "path=$SOLUTION" >> $GITHUB_OUTPUT

      # ========================================================
      # RESTORE
      # ========================================================
      - name: Restore dependencies
        run: |
          dotnet restore "${{ steps.solution.outputs.path }}"

      # ========================================================
      # BUILD
      # ========================================================
      - name: Build solution
        run: |
          dotnet build "${{ steps.solution.outputs.path }}" \
            --configuration Release \
            --no-restore

      # ========================================================
      # EF CORE
      # ========================================================
      - name: Install EF Core Tools
        run: |
          dotnet tool install --global dotnet-ef

      - name: Add EF Tools to PATH
        run: |
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check EF Core version
        run: |
          dotnet ef --version

      # ========================================================
      # APLICA MIGRATIONS
      # ========================================================
      - name: Apply database migrations
        run: |
          dotnet ef database update \
            --project TireControl.Infrastructure \
            --startup-project TireControl.Api \
            --configuration Release \
            --no-build
