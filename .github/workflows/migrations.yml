name: Database Migrations

on:
pull_request:
branches:
- main
- develop

push:
branches:
- main
- develop

workflow_dispatch:

jobs:

validate-migrations:
name: Validate Database Migrations
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Show repository structure
    run: |
      echo "Current directory:"
      pwd

      echo ""
      echo "Solution files:"
      find . -name "*.sln"

      echo ""
      echo "Project files:"
      find . -name "*.csproj"

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: "10.0.x"

  - name: Restore API dependencies
    run: |
      dotnet restore "./Cumorah.TireControl/TireControl.Api/TireControl.Api.csproj"

  - name: Build API
    run: |
      dotnet build "./Cumorah.TireControl/TireControl.Api/TireControl.Api.csproj" \
        --configuration Release \
        --no-restore

  - name: Install EF Core Tools
    run: |
      dotnet tool install --global dotnet-ef

  - name: Add EF Tools to PATH
    run: |
      echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

  - name: Check EF Core version
    run: |
      dotnet ef --version

  - name: Validate EF Core migrations
    run: |
      dotnet ef migrations list \
        --project "./Cumorah.TireControl/TireControl.Infrastructure/TireControl.Infrastructure.csproj" \
        --startup-project "./Cumorah.TireControl/TireControl.Api/TireControl.Api.csproj" \
        --configuration Release \
        --no-build

apply-migrations:
name: Apply Database Migrations
runs-on: ubuntu-latest

if: github.ref == 'refs/heads/main' && github.event_name == 'push'

needs: validate-migrations

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: "10.0.x"

  - name: Restore API dependencies
    run: |
      dotnet restore "./Cumorah.TireControl/TireControl.Api/TireControl.Api.csproj"
  - name: Build API
    run: |
      dotnet build "./Cumorah.TireControl/TireControl.Api/TireControl.Api.csproj" \
        --configuration Release \
        --no-restore

  - name: Install EF Core Tools
    run: |
      dotnet tool install --global dotnet-ef

  - name: Add EF Tools to PATH
    run: |
      echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

  - name: Check EF Core version
    run: |
      dotnet ef --version

  - name: List EF Core migrations
    run: |
      dotnet ef migrations list \
        --project "./Cumorah.TireControl/TireControl.Infrastructure/TireControl.Infrastructure.csproj" \
        --startup-project "./Cumorah.TireControl/TireControl.Api/TireControl.Api.csproj" \
        --configuration Release \
        --no-build

  - name: Apply database migrations
    run: |
      dotnet ef database update \
        --project "./Cumorah.TireControl/TireControl.Infrastructure/TireControl.Infrastructure.csproj" \
        --startup-project "./Cumorah.TireControl/TireControl.Api/TireControl.Api.csproj" \
        --configuration Release \
        --no-build
```
